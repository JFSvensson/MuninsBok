packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": true
  core-js: true
  esbuild: true
  prisma: true
  tesseract.js: true

onlyBuiltDependencies:
  - "@prisma/engines"
  - "core-js"
  - "esbuild"
  - "prisma"
  - "tesseract.js"

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

overrides:
  brace-expansion: 5.0.12
  dompurify: 3.4.16
  fflate: 0.8.3
  deepmerge-ts: 8.0.2
  "fast-uri@^3.1.3": 3.1.8
  "fast-uri@^4.1.1": 4.1.5
  find-my-way: 9.7.0
  mysql2: 3.23.1
  valibot: 1.4.2
